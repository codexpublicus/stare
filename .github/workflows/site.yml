name: site

# Checks and previews. Nothing here deploys production: the sanctioned path to
# production is merging the release PR, which runs release.yml.
#
# - pull requests: build, upload a Worker version, comment its preview URL,
#   and smoke test it. Dependabot's PRs only build: a workflow Dependabot
#   triggers sees only Dependabot secrets, and the infrastructure stack doesn't
#   give it the Workers token.
# - pushes to main: build and upload a Worker version to the stable `main`
#   preview alias (https://main-stare-pub.nick-441.workers.dev), and smoke
#   test that version. release.yml refuses to release a merge commit whose
#   run failed, so the smoke test gates releases.
#
# Every job runs on GitHub-hosted runners. The build needs no secrets (citare is
# fetched over https), so a pull request from a fork gets the same checks and
# build in the "Build fork PR" job, but no preview or smoke test, which need the
# Workers token a fork's PR doesn't get; a maintainer can push the branch to
# this repository to preview it. No job runs on pull_request_target or checks
# out a fork's code with a secret in reach.
#
# A PR's smoke test skips the specs whose inputs are byte-identical to a run
# that passed (web/e2e/inputs.js, .github/actions/smoke-test); main, the
# release PR and a PR labelled full-smoke run every spec.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-preview:
    name: Preview PR
    # Same-repository PRs only: a fork's PR gets no secrets (see the header).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-site
        with:
          release: pr-${{ github.event.number }}
          commit: ${{ github.event.pull_request.head.sha }}

      # Dependabot has no Workers token (see the header), and a dependency
      # bump runs that dependency's new build scripts, so it never gets one.
      - name: Deploy preview
        id: preview
        if: github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.141.0 versions upload --message "PR #${{ github.event.number }}" | tee wrangler-output.txt
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev[^[:space:]]*' wrangler-output.txt | head -n1 || true)
          if [ -z "$url" ]; then
            echo "::error::no preview URL found in wrangler versions upload output"
            echo "--- last 20 lines of wrangler output ---"
            tail -n 20 wrangler-output.txt
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          marker="<!-- stare-preview -->"
          body=$(printf '%s\nPreview: %s\n' "$marker" "$PREVIEW_URL")
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$comment_id" ]; then
            gh api "repos/$REPO/issues/comments/$comment_id" -X PATCH -f body="$body"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -f body="$body"
          fi

      # Labels are read now rather than from the event, so adding full-smoke and
      # re-running the job runs every spec.
      - name: Choose the smoke specs
        id: smoke-scope
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          reason=""
          if [ "$HEAD_REF" = release/next ]; then
            reason="the release PR"
          elif gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' | grep -qx full-smoke; then
            reason="the full-smoke label"
          fi
          echo "select=$([ -n "$reason" ] && echo all || echo affected)" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      # After the comment, so a failing preview still gets its URL posted.
      - uses: ./.github/actions/smoke-test
        if: github.actor != 'dependabot[bot]'
        with:
          url: ${{ steps.preview.outputs.url }}
          select: ${{ steps.smoke-scope.outputs.select }}
          select-reason: ${{ steps.smoke-scope.outputs.reason }}
          record: pr-${{ github.event.number }}

  # A fork's PR gets the checks and the build, which need no secrets, but no
  # preview or smoke test: those need the Workers token, which GitHub doesn't
  # give a fork's PR.
  fork-pr:
    name: Build fork PR (no preview)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-site
        with:
          release: pr-${{ github.event.number }}
          commit: ${{ github.event.pull_request.head.sha }}

      - name: Explain
        run: |
          msg="This PR comes from a fork, which gets no secrets, so it was checked and built but not previewed or smoke tested. A maintainer can push this branch to codexpublicus/stare to run them."
          echo "::notice title=Fork PR not previewed::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  main-preview:
    # Named so a green check on main isn't mistaken for a release.
    name: Preview main (not production)
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'codexpublicus/stare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No concurrency group: cancelling this run would fail release.yml's check
    # of the release PR's merge commit, which waits for it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build label
        id: label
        run: echo "release=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-site
        with:
          release: ${{ steps.label.outputs.release }}
          commit: ${{ github.sha }}

      # release.yml deploys this commit's stare-wasm build, citare data
      # bundle and reporter map from here if the commit is a release PR's
      # merge, instead of building and checking them again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-wasm
          path: |
            web/public/wasm/
            web/public/data/citare/
            web/public/reporters.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload to the main preview alias
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE: ${{ steps.label.outputs.release }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.141.0 versions upload --preview-alias main --message "$RELEASE" | tee wrangler-output.txt
          {
            echo "Uploaded \`$RELEASE\` to the \`main\` preview alias. This is not production; production changes only when the release PR merges."
            echo
            grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev[^[:space:]]*' wrangler-output.txt | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          # Smoke test this version's own URL, not the alias, which a later
          # push to main can move while this job is still running.
          url=$(grep -oE 'Version Preview URL: https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-output.txt | head -n1 | sed 's/^Version Preview URL: //' || true)
          if [ -z "$url" ]; then
            echo "::error::no Version Preview URL found in wrangler versions upload output"
            echo "--- last 20 lines of wrangler output ---"
            tail -n 20 wrangler-output.txt
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # No retries: this run gates releases, and a test that passes only on
      # its retry is flaky and should fail here, where it shows (#133).
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ steps.preview.outputs.url }}
          retries: '0'
          select-reason: a push to main
          record: main
