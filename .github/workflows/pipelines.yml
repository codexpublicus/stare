name: pipelines

on:
  pull_request:
    paths:
      - "pipelines/**"
      - ".github/workflows/pipelines.yml"
  push:
    branches:
      - main
    paths:
      - "pipelines/**"
      - ".github/workflows/pipelines.yml"

permissions:
  contents: read

jobs:
  archival-pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/archival-pdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: pipelines/archival-pdf
          enable-cache: true
          cache-dependency-glob: pipelines/archival-pdf/uv.lock

      - name: Install
        run: uv sync --locked

      # external tools for the marked tests: poppler (pdfimages/pdftotext) and jbig2enc from
      # the pinned image that Jbig2Encoder.locate() picks up (veraPDF tests skip here)
      - name: Test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils
          docker pull "jbarlow83/ocrmypdf:v16.10.4@sha256:60908d9f007a6f621769f6ecabdbc04e39845b5ca5342debaad504bc8efe050b"

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest
        env:
          # use the pulled image, so the jbig2 tests fail rather than skip if it's missing
          STARE_JBIG2: docker
