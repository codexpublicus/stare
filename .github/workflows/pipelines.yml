name: pipelines

on:
  pull_request:
    paths:
      - "pipelines/**"
      - ".github/workflows/pipelines.yml"
  push:
    branches:
      - main
    paths:
      - "pipelines/**"
      - ".github/workflows/pipelines.yml"

permissions:
  contents: read

jobs:
  archival-pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/archival-pdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: pipelines/archival-pdf
          enable-cache: true
          cache-dependency-glob: pipelines/archival-pdf/uv.lock

      - name: Install
        run: uv sync --locked

      # external tools for the marked tests: poppler (pdfimages/pdftotext), plus jbig2enc and
      # veraPDF from the images pinned in stare_archival.images (the only copy of the digests)
      - name: Test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils
          for image in $(uv run python -m stare_archival.images); do docker pull -q "$image"; done

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest
        env:
          # use the pulled images, so the jbig2 and veraPDF tests fail rather than skip if
          # either is missing
          STARE_JBIG2: docker
          STARE_VERAPDF: docker

  # the pipeline image (pipelines/archival-pdf/Dockerfile) builds, and builds the fixture
  # volume with its native jbig2, then skips it on a second run
  archival-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --build-arg REVISION="$GITHUB_SHA" --tag stare-archival:ci pipelines/archival-pdf

      - name: Build the fixture volume in the image
        run: pipelines/archival-pdf/scripts/image_smoke.sh stare-archival:ci

      - name: Image id and size
        run: docker image inspect --format '{{.Id}} {{.Size}}' stare-archival:ci
