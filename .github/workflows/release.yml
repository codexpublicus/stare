name: release

# The sanctioned path to production. Runs when the bot's release PR (branch
# release/next, kept up to date by release-prepare.yml) is merged into main.
# The bot is the yeet App (codexpublicus-yeet[bot]):
#
# build (contents: read, no git credentials on disk):
#   1. wait for the merge commit's push checks (site.yml) and refuse if any failed;
#   2. compute vYYYY.MM.DD.N from the tags as they are after the wait
#      (scripts/calver.mjs; N is one more than the day's highest release);
#   3. download the stare-wasm build and citare data bundle that site.yml's
#      main build of the merge commit made, checked and smoke tested, rerun
#      only the Astro build, with the release tag and a changelog regenerated
#      for it, and hand web/dist and the notes to the next job as an artifact.
#      Nothing in Rust is rebuilt: step 1 already required that run to pass.
# release (contents: write, runs no build code):
#   4. refuse if a newer release tag exists, so a re-run can't roll production back;
#   5. create the tag on the merge commit through the API, refusing if it exists
#      elsewhere, and the GitHub Release with the git-cliff notes;
#   6. deploy production (stare.pub) with wrangler;
#   7. dispatch release-prepare.yml so the release PR and CHANGELOG.md catch up.
#
# The tag, release and deploy share one job, and nothing listens for
# `push: tags` or `release`, because a tag or release created with GITHUB_TOKEN
# doesn't trigger other workflows.
#
# Re-running is safe: if the merge commit already has a release tag, the build
# reuses it (and only while it's still the newest release), and the release job
# only creates what's missing.

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Only real release runs share the group; every other PR closure gets a group of
# its own, so it can't displace a queued release.
concurrency:
  group: >-
    ${{ (github.event.pull_request.merged == true &&
    github.event.pull_request.head.ref == 'release/next')
    && 'site-release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

env:
  SHA: ${{ github.event.pull_request.merge_commit_sha }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build the release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'codexpublicus-yeet[bot]'
    runs-on: homelab
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for the merge commit's checks
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The merge commit's push to main runs site.yml (and the other push
          # workflows); this run is a pull_request event, so it isn't in the list.
          # site must succeed. Any other run fails the release only on an actual
          # failure: release-prepare, say, may be cancelled by a newer push.
          deadline=$(( $(date +%s) + 60 * 60 ))
          while :; do
            runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=push&per_page=100" \
              --jq '[.workflow_runs[] | {name, status, conclusion, url: .html_url}]')
            echo "$runs" | jq -r '.[] | "\(.name): \(.status)/\(.conclusion // "pending")"'
            site_done=$(echo "$runs" | jq '[.[] | select(.name == "site" and .status == "completed")] | length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$site_done" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the merge commit's checks"
              exit 1
            fi
            sleep 30
          done
          failed=$(echo "$runs" | jq -r '
            [.[] | select(
              (.name == "site" and .conclusion != "success") or
              (.conclusion as $c | ["failure", "timed_out", "action_required", "startup_failure"] | index($c))
            )] | map("\(.name) (\(.conclusion)): \(.url)") | join("\n")')
          if [ -n "$failed" ]; then
            echo "::error::Checks failed on $SHA; refusing to release"
            echo "$failed"
            exit 1
          fi
          # The site run whose build step 3 deploys: site.yml itself, pushed to
          # main in this repo at the merge commit, and successful.
          site_run=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=push&per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .path, .head_branch, .head_sha, .head_repository.full_name, .conclusion] | @tsv' \
            | awk -F'\t' -v sha="$SHA" -v repo="$GH_REPO" \
              '$2 == "site" && $3 == ".github/workflows/site.yml" && $4 == "main" && $5 == sha && $6 == repo && $7 == "success" { print $1 }' \
            | sort -n | tail -n1)
          if [ -z "$site_run" ]; then
            echo "::error::No successful site run on main for $SHA"
            exit 1
          fi
          echo "site-run=$site_run" >> "$GITHUB_OUTPUT"
          echo "Deploying the build from site run $site_run"

      # scripts/calver.mjs and the Astro build; the homelab runner image has no Node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compute the release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read the tags now, after the wait, through the API; the checkout's
          # tags are as old as the start of the job.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[] | "\(.ref | sub("^refs/tags/"; "")) \(.object.sha)"' > "$RUNNER_TEMP/tags.txt"
          cut -d' ' -f1 "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/tag-names.txt"
          newest=$(node scripts/calver.mjs --newest < "$RUNNER_TEMP/tag-names.txt")
          existing=$(awk -v sha="$SHA" '$2 == sha { print $1 }' "$RUNNER_TEMP/tags.txt" \
            | node scripts/calver.mjs --newest)
          if [ -n "$existing" ]; then
            if [ "$existing" != "$newest" ]; then
              echo "::error::$SHA is $existing, but $newest is newer; re-running would roll production back"
              exit 1
            fi
            echo "Merge commit is already tagged $existing (a re-run); reusing it."
            version=$existing
            rerun=true
          else
            version=$(node scripts/calver.mjs --next < "$RUNNER_TEMP/tag-names.txt")
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | node scripts/calver.mjs --newest)" != "$version" ]; then
              echo "::error::$newest is newer than the computed $version"
              exit 1
            fi
            rerun=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rerun=$rerun" >> "$GITHUB_OUTPUT"
          echo "Release: $version at $SHA"

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: git-cliff@2.14.2

      - name: Release notes and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RERUN: ${{ steps.version.outputs.rerun }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          # Load the tag list read after the wait into the clone, so git-cliff
          # measures from the real previous release even if it was tagged after
          # checkout. Tags on commits this clone doesn't have are skipped.
          while read -r name sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git tag -f "$name" "$sha" >/dev/null
            fi
          done < "$RUNNER_TEMP/tags.txt"
          if [ "$RERUN" = true ]; then
            # The tag exists; describe exactly the range that ends at it.
            if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$VERSION^" 2>/dev/null); then
              git cliff "$prev..$VERSION" --strip all > "$RUNNER_TEMP/release/notes.md"
            else
              # The first release: no earlier tag, and the check above made sure
              # it is the newest, so the baseline range up to this tag is its range.
              scripts/cliff "$(head -n1 scripts/release-baseline)..$VERSION" --strip all > "$RUNNER_TEMP/release/notes.md"
            fi
            scripts/cliff --output CHANGELOG.md
          else
            scripts/cliff --unreleased --tag "$VERSION" --strip all > "$RUNNER_TEMP/release/notes.md"
            # Not committed: /about renders this build's changelog, headed with the
            # real tag even if the release PR previewed a different date.
            scripts/cliff --tag "$VERSION" --output CHANGELOG.md
          fi
          cat "$RUNNER_TEMP/release/notes.md"

      # The stare-wasm module, citare data bundle and reporter map that site
      # run built from this commit, after its cargo fmt, clippy, tests and JS tests passed.
      # Kept 3 days, so a release re-run after that fails here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-wasm
          path: web/public
          run-id: ${{ steps.checks.outputs.site-run }}
          github-token: ${{ github.token }}

      - name: Check the downloaded build
        run: |
          set -euo pipefail
          test -s web/public/wasm/stare_wasm_bg.wasm
          test -s web/public/wasm/stare_wasm.js
          test -s web/public/reporters.json
          # The Astro build checks the bundle's name against its SHA-256.
          ls -l web/public/wasm web/public/data/citare/v1

      # The same Astro build as the previews, with the release tag in the footer
      # and the changelog regenerated above
      - uses: ./.github/actions/build-web
        with:
          release: ${{ steps.version.outputs.version }}
          commit: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Collect the release files
        run: |
          set -euo pipefail
          cp -R web/dist "$RUNNER_TEMP/release/dist"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7
          # A re-run of all jobs uploads again under the same name.
          overwrite: true

  release:
    name: Release and deploy production
    needs: build
    runs-on: homelab
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # For wrangler.jsonc and scripts/calver.mjs; nothing here builds or installs
      # the repo's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      # scripts/calver.mjs and wrangler; the homelab runner image has no Node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Refuse if a newer release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checked before tagging, so a refused release leaves no tag behind.
          newest=$( { gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("^refs/tags/"; "")'; echo "$VERSION"; } | node scripts/calver.mjs --newest)
          if [ "$newest" != "$VERSION" ]; then
            echo "::error::$newest is newer than $VERSION; not deploying an older release"
            exit 1
          fi

      - name: Tag the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$VERSION" -f sha="$SHA" >/dev/null 2>&1; then
            echo "Created $VERSION at $SHA"
          else
            actual=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)
            if [ "$actual" != "$SHA" ]; then
              echo "::error::$VERSION already exists on $actual, not $SHA; use 'Re-run all jobs' so the build computes a new tag"
              exit 1
            fi
            echo "$VERSION already points at $SHA (a re-run)"
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists (a re-run)."
          else
            gh release create "$VERSION" --verify-tag \
              --title "$VERSION" \
              --notes-file "$RUNNER_TEMP/release/notes.md"
          fi

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -rf web/dist
          mkdir -p web
          cp -R "$RUNNER_TEMP/release/dist" web/dist
          npx --yes wrangler@4.141.0 deploy --tag "$VERSION" --message "Release $VERSION"
          echo "Deployed $VERSION ($SHA) to https://stare.pub" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-prepare.yml --ref main
