name: release-prepare

# Keeps one open release PR (branch release/next) whose CHANGELOG.md carries the
# notes for everything releasable since the last vYYYY.MM.DD.N tag. Merging it
# runs release.yml, which tags, releases and deploys production.
#
# The version in the PR's CHANGELOG.md is a preview computed from today's date;
# release.yml fixes the real version at merge time and builds with a changelog
# regenerated for it, then dispatches this workflow. With nothing new to release,
# that run closes any stale release PR and, if CHANGELOG.md on main still carries
# the preview heading (a PR merged on a later day than it was last updated),
# opens a "sync CHANGELOG.md" PR from release/changelog-sync. That branch isn't
# release/next, so merging it releases nothing.
#
# Both PRs are opened with the yeet GitHub App's token, so their CI runs like
# any other PR's; GitHub holds the checks on a PR that GITHUB_TOKEN opens until
# someone approves them. YEET_APP_ID (a variable, the App's client ID) and
# YEET_APP_PRIVATE_KEY (a secret) are pushed by codexpublicus/infra (yeet.py),
# and the App's installation must list this repo. While either value is
# missing, the PRs are opened with GITHUB_TOKEN as before, with a warning on the
# run; that path needs "Allow GitHub Actions to create and approve pull
# requests" enabled for the repo. With the values set, a token that won't mint
# (the App not installed here) fails the run. The checks that gate a release
# still run on the merge commit (release.yml).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-prepare
  cancel-in-progress: true

permissions: {}

env:
  RELEASE_BRANCH: release/next
  SYNC_BRANCH: release/changelog-sync

jobs:
  prepare:
    name: Update the release PR
    runs-on: homelab
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Skip the release PR's own merge
        id: gate
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Merge commit, squash and rebase merges of the release PR respectively.
          first_line=$(printf '%s\n' "$MESSAGE" | head -n1)
          case "$first_line" in
            "Merge pull request #"*" from ${GITHUB_REPOSITORY_OWNER}/${RELEASE_BRANCH}" | "chore(release):"*)
              echo "Head commit is the release PR landing; release.yml handles it."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Is the yeet App configured?
        id: yeet
        if: steps.gate.outputs.skip != 'true'
        env:
          APP_ID: ${{ vars.YEET_APP_ID }}
          HAS_KEY: ${{ secrets.YEET_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$APP_ID" ] && [ "$HAS_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=yeet App not configured::YEET_APP_ID or YEET_APP_PRIVATE_KEY is missing (codexpublicus/infra, yeet.py). Opening PRs with GITHUB_TOKEN, so their CI waits for approval."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the yeet App token
        id: app-token
        if: steps.yeet.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YEET_APP_ID }}
          private-key: ${{ secrets.YEET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explain a token that wouldn't mint
        if: failure() && steps.app-token.outcome == 'failure'
        run: |
          echo "::error title=yeet App token::The yeet App's values are set, but no token minted. Add ${GITHUB_REPOSITORY} under Repository access in the App's settings, or check that YEET_APP_PRIVATE_KEY matches the App."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # scripts/calver.mjs; the homelab runner image has no Node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: steps.gate.outputs.skip != 'true'
        with:
          tool: git-cliff@2.14.2

      - name: Compute the unreleased notes
        id: notes
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          count=$(scripts/cliff --unreleased --context | jq '[.[].commits[]] | length')
          if [ "$count" -eq 0 ]; then
            echo "No releasable commits (only hidden types) since the last release."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            scripts/cliff --output CHANGELOG.md
            if git diff --quiet -- CHANGELOG.md; then
              echo "sync=false" >> "$GITHUB_OUTPUT"
            else
              echo "CHANGELOG.md on main differs from the tags; proposing a sync."
              echo "sync=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          version=$(node scripts/calver.mjs)
          scripts/cliff --tag "$version" --output CHANGELOG.md
          notes=$(scripts/cliff --unreleased --tag "$version" --strip all)
          {
            echo "Merging this PR releases the site and deploys it to production (stare.pub)."
            echo
            echo "The version below is a preview from today's date. The real \`vYYYY.MM.DD.N\` is computed when this PR merges; release.yml tags the merge commit, creates the GitHub Release with these notes and deploys."
            echo
            echo "$notes"
          } > "$RUNNER_TEMP/release-pr-body.md"
          echo "releasable=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$count releasable commit(s); previewing as $version"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.notes.outputs.releasable == 'true'
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          base: main
          add-paths: CHANGELOG.md
          commit-message: "chore(release): update CHANGELOG.md for the next site release"
          title: "chore(release): next site release"
          body-path: ${{ runner.temp }}/release-pr-body.md
          delete-branch: true
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Close a release PR with nothing left to release
        if: steps.notes.outputs.releasable == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$pr" --comment "Everything in this PR has been released; closing."
          done

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.notes.outputs.sync == 'true'
        with:
          branch: ${{ env.SYNC_BRANCH }}
          base: main
          add-paths: CHANGELOG.md
          commit-message: "chore(release): sync CHANGELOG.md with the release tags"
          title: "chore(release): sync CHANGELOG.md with the release tags"
          body: "Rewrites CHANGELOG.md from the release tags, replacing the heading the release PR previewed. Merging this releases and deploys nothing."
          delete-branch: true
          token: ${{ steps.app-token.outputs.token || github.token }}
