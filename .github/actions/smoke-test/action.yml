name: Smoke test a deployed site
description: >
  Runs the Playwright smoke suite (web/e2e/) in Chromium against a deployed
  stare.pub, such as the workers.dev preview a site.yml job just uploaded.
  Expects build-site to have run already, so web/node_modules exists. Needs
  no secrets: previews are public.

inputs:
  url:
    description: Base URL of the site to test
    required: true
  retries:
    description: >
      Retries for a failed test, overriding playwright.config.js (one in
      CI). Empty keeps the config's.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: ./.github/actions/chromium

    - name: Wait for the preview
      shell: bash
      env:
        STARE_BASE_URL: ${{ inputs.url }}
      # A version just uploaded can take a few seconds to answer.
      run: curl --silent --show-error --fail --output /dev/null --retry 12 --retry-delay 5 --retry-all-errors "$STARE_BASE_URL/"

    - name: Smoke test
      shell: bash
      env:
        STARE_BASE_URL: ${{ inputs.url }}
        RETRIES: ${{ inputs.retries }}
      run: web/node_modules/.bin/playwright test --config web/playwright.config.js ${RETRIES:+--retries="$RETRIES"}

    - name: Upload traces
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: smoke-test-results
        path: web/test-results
        if-no-files-found: ignore
        retention-days: 3
        overwrite: true
