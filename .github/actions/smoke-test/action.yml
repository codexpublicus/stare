name: Smoke test a deployed site
description: >
  Runs the Playwright smoke suite (web/e2e/) in Chromium against a deployed
  stare.pub, such as the workers.dev preview a site.yml job just uploaded.
  Expects build-site to have run already, so web/node_modules exists. Needs
  no secrets: previews are public.

inputs:
  url:
    description: Base URL of the site to test
    required: true
  # Which specs to run (#294; web/e2e/select.mjs). "affected" skips a spec whose
  # inputs (web/e2e/inputs.js) hash to one a recorded run passed; "all" runs them all.
  select:
    description: '"all" or "affected"'
    required: false
    default: all
  select-reason:
    description: Why every spec runs, for the job summary
    required: false
    default: ''
  # Where this run records the input hashes of the specs that passed: "main" for
  # main's record, which every PR reads, "pr-<number>" for a PR's own. Empty records
  # nothing and hashes nothing (the run needs the build's WASM to hash).
  record:
    description: '"main", "pr-<number>", or empty'
    required: false
    default: ''
  retries:
    description: >
      Retries for a failed test, overriding playwright.config.js (one in
      CI). Empty keeps the config's.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Where this Playwright puts its headless shell, and which revision it pins.
    # The browsers' directory comes from Playwright rather than a fixed
    # ~/.cache/ms-playwright, so the cache follows the runner's HOME if it moves.
    - name: Locate Chromium
      id: playwright
      shell: bash
      run: |
        set -euo pipefail
        version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")
        location=$(web/node_modules/.bin/playwright install --dry-run --only-shell chromium \
          | awk '/chromium-headless-shell v/ { found = 1 } found && /Install location:/ { print $3; exit }')
        if [ -z "$location" ]; then
          echo "::error::couldn't find the headless shell's install location in 'playwright install --dry-run'"
          exit 1
        fi
        # The runner image's version (GARM_RUNNER_VERSION), so a new image doesn't restore browsers
        # cached under an old one (lokkju/infra#106); "unknown" until the
        # image sets it.
        image=${GARM_RUNNER_VERSION:-${GARM_RUNNER_IMAGE:-unknown}}
        {
          echo "version=$version"
          echo "location=$location"
          echo "browsers=$(dirname "$location")"
          echo "revision=$(basename "$location")"
          echo "image=$(printf '%s' "$image" | tr -c 'A-Za-z0-9._-' '_')"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.playwright.outputs.browsers }}
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.revision }}

    # Checked rather than trusting a cache hit: in stare run 37386159181 the
    # cache hit but the headless shell wasn't where Playwright looked.
    - name: Install Chromium
      shell: bash
      env:
        LOCATION: ${{ steps.playwright.outputs.location }}
      run: |
        set -euo pipefail
        shell() { find "$LOCATION" -name chrome-headless-shell -type f -perm -u+x -print -quit 2>/dev/null || true; }
        if [ -n "$(shell)" ]; then
          echo "headless shell present: $(shell)"
          exit 0
        fi
        web/node_modules/.bin/playwright install --only-shell chromium
        if [ -z "$(shell)" ]; then
          echo "::error::playwright install finished, but there's no chrome-headless-shell under $LOCATION"
          exit 1
        fi

    # The image is meant to have Chromium's shared libraries, since without
    # passwordless sudo (lokkju/infra#105) install-deps can't apt-get them.
    # ldd says exactly what the headless shell can't load; install-deps
    # --dry-run also lists fonts and X packages it doesn't need to start.
    - name: Check Chromium's system libraries
      shell: bash
      env:
        LOCATION: ${{ steps.playwright.outputs.location }}
      run: |
        set -euo pipefail
        unresolved() {
          { find "$LOCATION" -type f \( -name chrome-headless-shell -o -name '*.so' -o -name '*.so.*' \) \
            -exec ldd {} + 2>/dev/null || true; } | awk '/not found/ { print $1 }' | sort -u
        }
        missing=$(unresolved)
        if [ -z "$missing" ]; then
          echo "the headless shell's shared libraries all resolve"
          exit 0
        fi
        echo "unresolved libraries: ${missing//$'\n'/ }"
        if [[ "$(id -u)" == 0 ]] || sudo -n true 2>/dev/null; then
          web/node_modules/.bin/playwright install-deps chromium-headless-shell
          missing=$(unresolved)
          [ -z "$missing" ] && exit 0
        fi
        echo "::error::Chromium can't load ${missing//$'\n'/ } and the runner has no passwordless sudo for 'playwright install-deps' (lokkju/infra#105); add Chromium's libraries to homelab/images/garm-runner/Dockerfile in lokkju/infra"
        exit 1

    - name: Wait for the preview
      shell: bash
      env:
        STARE_BASE_URL: ${{ inputs.url }}
      # A version just uploaded can take a few seconds to answer.
      run: curl --silent --show-error --fail --output /dev/null --retry 12 --retry-delay 5 --retry-all-errors "$STARE_BASE_URL/"

    # The record of passing input hashes is a small JSON file in the Actions cache,
    # saved under a new key by each run that records and restored by prefix (the
    # newest). main's is visible to every PR; a PR's own only to that PR. A miss or a
    # hashing failure just runs more.
    - name: Hash the specs' inputs
      id: keys
      if: inputs.record != '' || inputs.select == 'affected'
      shell: bash
      run: |
        if node web/e2e/select.mjs keys --out "$RUNNER_TEMP/smoke-keys.json"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::couldn't hash the smoke specs' inputs; every spec runs and nothing is recorded"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore main's record of passing specs
      if: steps.keys.outputs.ok == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .smoke-passes/main.json
        key: smoke-passes-main-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: smoke-passes-main-

    - name: Restore this PR's record of passing specs
      if: steps.keys.outputs.ok == 'true' && startsWith(inputs.record, 'pr-')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .smoke-passes/pr.json
        key: smoke-passes-${{ inputs.record }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: smoke-passes-${{ inputs.record }}-

    - name: Choose the specs
      id: plan
      shell: bash
      env:
        OK: ${{ steps.keys.outputs.ok }}
        SELECT: ${{ inputs.select }}
        REASON: ${{ inputs.select-reason }}
      run: |
        set -euo pipefail
        if [ "$OK" != true ]; then
          echo "filters=" >> "$GITHUB_OUTPUT"
          echo "run=all" >> "$GITHUB_OUTPUT"
          printf '### Smoke specs\n\nEvery spec runs (%s).\n' "${REASON:-inputs not hashed}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        node web/e2e/select.mjs plan --keys "$RUNNER_TEMP/smoke-keys.json" --mode "$SELECT" --reason "$REASON" \
          --ledger .smoke-passes/main.json --ledger .smoke-passes/pr.json

    - name: Smoke test
      if: steps.plan.outputs.run != '0'
      shell: bash
      env:
        STARE_BASE_URL: ${{ inputs.url }}
        RETRIES: ${{ inputs.retries }}
        FILTERS: ${{ steps.plan.outputs.filters }}
        STARE_SMOKE_REPORT: ${{ runner.temp }}/smoke-report.json
      run: |
        read -ra filters <<< "$FILTERS"
        web/node_modules/.bin/playwright test --config web/playwright.config.js ${RETRIES:+--retries="$RETRIES"} "${filters[@]}"

    # After a failure too: a spec that failed or passed only on a retry gets its
    # hash marked failed, so no later run reuses an older pass of the same inputs.
    - name: Record the specs that passed
      id: record
      if: always() && inputs.record != '' && steps.keys.outputs.ok == 'true' && steps.plan.outcome == 'success' && steps.plan.outputs.run != '0'
      shell: bash
      env:
        RECORD: ${{ inputs.record }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        name=$([ "$RECORD" = main ] && echo main || echo pr)
        mkdir -p .smoke-passes
        node web/e2e/select.mjs record --keys "$RUNNER_TEMP/smoke-keys.json" --report "$RUNNER_TEMP/smoke-report.json" \
          --ledger .smoke-passes/main.json --ledger .smoke-passes/pr.json --run "$RUN_URL" --out "$RUNNER_TEMP/smoke-passes.json"
        mv "$RUNNER_TEMP/smoke-passes.json" ".smoke-passes/$name.json"
        echo "path=.smoke-passes/$name.json" >> "$GITHUB_OUTPUT"

    - name: Save the record
      if: always() && steps.record.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.record.outputs.path }}
        key: smoke-passes-${{ inputs.record }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload traces
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: smoke-test-results
        path: web/test-results
        if-no-files-found: ignore
        retention-days: 3
        overwrite: true
