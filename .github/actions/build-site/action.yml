name: Build and check the site
description: >
  The checks and build site.yml's previews run: cargo fmt, clippy and tests,
  the stare-wasm build, the JS tests, citare's data bundle, the Astro build
  into web/dist (build-web), and the build's URLs against content blockers'
  filter lists. release.yml doesn't run it: it deploys the
  stare-wasm build and data bundle the merge commit's main build made and
  checked, with only the Astro build redone for the release tag. Expects the
  repo to be checked out already.

inputs:
  ssh-private-key:
    description: Deploy key for the private citare dependency (secrets.CITARE_DEPLOY_KEY)
    required: true
  release:
    description: >
      The build's label, shown in the footer: the release tag, main-<sha>, or
      pr-<number>. Empty shows "dev".
    required: false
    default: ""
  commit:
    description: The commit SHA to show in the footer
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    # The toolchain pinned in rust-toolchain.toml, which also names the
    # wasm32 target and clippy and rustfmt for rustup
    - name: Read the pinned Rust toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error::no channel in rust-toolchain.toml"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt

    # Line tables only in the dev and test builds: panics and backtraces keep
    # their file and line, and the target directory the cache saves and every
    # job unpacks is smaller. Set before rust-cache, whose key includes CARGO_*
    # variables.
    - name: Trim debug info
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"

    # One cache for every job (the default key includes the job's name, so PR
    # jobs never restored main's), written only by pushes to main. PRs restore
    # it and save nothing, instead of each saving a ~575 MB cache of its own
    # that only it could read.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: site
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: wasm-pack@0.13.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: cargo fmt
      shell: bash
      run: cargo fmt --all --check

    - name: cargo clippy
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: cargo test
      shell: bash
      run: cargo test --workspace

    - name: Build stare-wasm
      shell: bash
      run: wasm-pack build crates/stare-wasm --target web --out-dir ../../web/public/wasm

    # After the WASM build: the JS tests load web/public/wasm for the parallel-citation
    # rules, which exist only in Rust (#185).
    - name: JS tests
      shell: bash
      run: node --test 'web/tests/**/*.test.js' 'scripts/tests/**/*.test.mjs'

    # The citare data bundle the module loads at runtime (#117), from the
    # citare version in Cargo.lock
    - name: Export citare's data bundle
      shell: bash
      run: cargo run --quiet -p stare-site -- export-citare-data web/public/data/citare/v1

    # The reporter map, /reporters.json (#161): citare's names and variations
    # from the same bundle, and the volumes the live index manifest lists
    - name: Write the reporter map
      shell: bash
      run: |
        set -euo pipefail
        manifest="$RUNNER_TEMP/index-manifest.json"
        curl -fsSL --retry 3 https://idx.stare.pub/manifest.json -o "$manifest"
        cargo run --quiet -p stare-site -- export-reporters --manifest "$manifest" web/public/reporters.json

    - uses: ./.github/actions/build-web
      with:
        release: ${{ inputs.release }}
        commit: ${{ inputs.commit }}

    # The build rewrote web/src/data/collection.json from the live index. The copy
    # in git is the snapshot the JS tests ran on; say so when the live index has
    # moved past it (#297). A warning, not a failure: the build itself has the
    # live figures, and an index publish shouldn't fail every PR until the
    # snapshot is committed.
    - name: Compare the collection snapshot with the live index
      shell: bash
      run: |
        set -euo pipefail
        if git diff --quiet -- web/src/data/collection.json; then
          echo "web/src/data/collection.json matches the live index"
        else
          git diff --stat -- web/src/data/collection.json web/public/llms.txt web/public/og-image.svg
          msg="web/src/data/collection.json is behind the live index; run npm --prefix web run collection and commit web/src/data/collection.json, web/public/llms.txt and web/public/og-image.*"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
        fi

    # Every URL in the build, and the data hosts' paths, against content blockers'
    # filter lists (#265; web/checks/). The lists are fetched at most daily; the cache
    # keeps the last day's, which the check falls back to (up to two weeks old) if a
    # list's host is down.
    - name: Date for the filter lists' cache
      id: filterlists
      shell: bash
      run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .filterlists
        key: filterlists-${{ steps.filterlists.outputs.day }}
        restore-keys: filterlists-

    - name: Check URLs against content blockers' lists
      shell: bash
      env:
        STARE_FILTERLIST_CACHE: ${{ github.workspace }}/.filterlists
      run: node --test 'web/checks/*.test.js'
