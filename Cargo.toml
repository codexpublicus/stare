[workspace]
members = ["crates/stare", "crates/stare-cli", "crates/stare-site", "crates/stare-wasm"]
resolver = "2"

# stare-site export-citare-data runs zopfli in the site build's dev-profile
# build; unoptimized it takes about 20 s on the bundle, optimized about 1 s.
[profile.dev.package.zopfli]
opt-level = 3

# The release binaries of `stare` (.github/workflows/stare-cli-release.yml): the
# release profile, stripped, with fat LTO and one codegen unit for size.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
