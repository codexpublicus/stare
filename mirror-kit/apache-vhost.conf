# An Apache 2.4 virtual host for a self-hosted copy of stare.pub (mirror-kit/README.md).
#
# Set STARE_ROOT to the copy's root (it holds site/, mirror/ and kit/) before this file is
# included, or replace ${STARE_ROOT} below:
#
#   Define STARE_ROOT /srv/stare
#   Include /srv/stare/kit/apache-vhost.conf
#
# It needs mod_rewrite, mod_headers, mod_mime and mod_setenvif (`a2enmod rewrite headers`
# on Debian and Raspberry Pi OS). The rules themselves are in apache.htaccess, included
# into the root's <Directory> block so that no .htaccess file is read. Add ServerName and
# TLS as you would for any site, and change the port if 80 is taken.

<VirtualHost *:80>
    # ServerName mirror.example.org
    DocumentRoot "${STARE_ROOT}"

    <Directory "${STARE_ROOT}">
        AllowOverride None
        Require all granted
        Include "${STARE_ROOT}/kit/apache.htaccess"
    </Directory>
</VirtualHost>
