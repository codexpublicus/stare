# nginx configuration for a self-hosted copy of stare.pub (mirror-kit/README.md).
#
# A map and a server block, both for the http block: copy this file into conf.d/ (or
# sites-enabled/), which nginx.conf includes there on most installs. Replace /srv/stare
# with the copy's root (it holds site/, mirror/ and kit/) and 8080 with the port to listen
# on; add server_name and TLS as you would for any site. / is served from site/,
# /mirror/ from mirror/, and /robots.txt from kit/robots.txt.
#
# The six rules every kit configuration implements (README.md, "What the server does"):
# 1. Real files win.
# 2. A browser navigation (Sec-Fetch-Mode: navigate) to a path no file matches gets
#    /index.html with a 200, which opens /k/ and /c/ addresses in the reader; any other
#    request for a missing path gets a 404.
# 3. /mirror/ never falls back: a missing data file is a 404.
# 4. Range requests work (nginx's default for static files), and nothing under /mirror/
#    is compressed on the fly.
# 5. .gz files are application/gzip with no Content-Encoding (the reader gunzips them
#    itself); JSON and text are charset=utf-8.
# 6. Content-hashed and immutable paths are cached for a year; everything else is
#    `max-age=0, must-revalidate`.

# Rule 6, by the path served ($uri: /index.html for the navigation fallback).
map $uri $stare_cache_control {
    "~^/(_astro/|data/citare/|vendor/pdfjs-|vendor/stare-search-|wasm/stare_wasm_bg\..+\.wasm$|wasm/stare_wasm\..+\.js$|mirror/idx/v/|mirror/data/crk/ledger/s/|mirror/data/cl/c/|mirror/data/pdf/.+\.pdf$)" "public, max-age=31536000, immutable";
    default "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    listen [::]:8080;
    # server_name mirror.example.org;

    root /srv/stare/site;
    index index.html;
    disable_symlinks off;
    autoindex off;

    # Rule 5. A types block replaces the inherited map, so the standard one comes first.
    include mime.types;
    types {
        application/gzip gz;
        application/wasm wasm;
        text/plain txt pub;
        text/javascript js mjs;
        application/json json;
    }
    charset utf-8;
    charset_types text/plain text/css text/javascript application/json application/xml text/xml image/svg+xml application/manifest+json;
    # No gzip_static: it would answer a .gz file's request with Content-Encoding. Where gzip
    # is on, only these types are compressed, never application/gzip (and never anything
    # under /mirror/, below).
    gzip_static off;
    gzip_types text/plain text/css text/javascript application/json application/xml text/xml image/svg+xml application/manifest+json;

    # Rule 6 and the security headers stare.pub sends (web/public/_headers). A location
    # with add_header of its own drops these, so none has.
    add_header Cache-Control $stare_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rules 3 and 4: the data, as files and nothing else.
    location /mirror/ {
        root /srv/stare;
        gzip off;
        try_files $uri =404;
    }

    location = /robots.txt {
        alias /srv/stare/kit/robots.txt;
    }

    # Rules 1 and 2: the site.
    location / {
        try_files $uri $uri/index.html @fallback;
    }

    location @fallback {
        if ($http_sec_fetch_mode != "navigate") {
            return 404;
        }
        try_files /index.html =404;
    }
}
