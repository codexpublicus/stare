# Serves a self-hosted copy of stare.pub with the official caddy:2 image and this kit's
# Caddyfile (mirror-kit/README.md). Run it from the copy's kit/ directory:
#
#   docker compose up -d
#
# The copy's root (this directory's parent: site/, mirror/, kit/) is mounted read-only.
# The copy is on port 8080 unless STARE_PORT says otherwise (`STARE_PORT=80 docker compose
# up -d`, or a .env file beside this one). A `sync` service that keeps the copy up to date
# with stare.pub's releases comes with the stare CLI's `stare mirror sync`; until then, an
# upgrade is the next release's tar extracted over the root (README.md, "Upgrade").

name: stare-mirror

services:
  web:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/srv/stare/kit/Caddyfile", "--adapter", "caddyfile"]
    environment:
      STARE_ROOT: /srv/stare
      STARE_LISTEN: ":8080"
    ports:
      - "${STARE_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ..
        target: /srv/stare
        read_only: true
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
