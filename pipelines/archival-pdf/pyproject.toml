[project]
name = "stare-archival"
version = "0.1.0"
description = "Build archival per-volume PDFs from the CAP tars (codexpublicus/stare#51)"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "S", "ARG", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
