[project]
name = "stare-archival"
version = "0.1.0"
description = "Build archival per-volume PDFs from the CAP tars (codexpublicus/stare#51)"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.66.1",
    "lxml>=6.1.3",
    "pikepdf>=10.15.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "jbig2: needs the jbig2 encoder (jbig2enc on PATH, $STARE_JBIG2, or the pinned Docker image)",
    "poppler: needs poppler's pdfimages/pdftotext on PATH",
    "verapdf: needs veraPDF (verapdf on PATH, $STARE_VERAPDF, or the pinned verapdf/cli image)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "S", "ARG", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
