services:
  aria2:
    image: hurlenko/aria2-ariang
    container_name: codex-mirror
    ports:
      - "8280:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - ARIA2RPCPORT=8280
      - RPC_SECRET=codex-publicus
      - EMBED_RPC_SECRET=true
    entrypoint: /aria2/init-input.sh
    command: ["--conf-path=/aria2/conf/aria2.conf"]
    volumes:
      - mirror-data:/aria2/data
      - ./aria2.conf:/aria2/conf-copy/aria2.conf:ro
      - ./urls-aria2-prioritized.txt:/aria2/urls-aria2.txt:ro
      - ./init-input.sh:/aria2/init-input.sh:ro
    restart: unless-stopped

# The mirror finished downloading (2026-09-27 count: 40,622 zips; 39,964 each of tars,
# tar.csv and PDFs). Its dataset, mega/codexpublicus/cap-mirror, is now read-only at both the
# NFS export and ZFS (readonly=on), so this service is stopped and mounts it read-only. To
# resume downloading, first turn readonly off on the dataset and the export, then change
# `ro` to `rw` below.
volumes:
  mirror-data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=truenas.lodenheim.lokkju.com,ro,nfsvers=4
      device: ":/mnt/mega/codexpublicus/cap-mirror"
