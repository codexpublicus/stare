# aria2 configuration for static.case.law mirror

# Concurrency
max-concurrent-downloads=10
max-connection-per-server=4
min-split-size=20M
split=4

# Resume support
continue=true
auto-file-renaming=false
allow-overwrite=false

# Session: save incomplete/errored downloads for resume
# input-file is set via init-input.sh symlink at /aria2/data/input.txt
input-file=/aria2/data/input.txt
save-session=/aria2/data/session.txt
save-session-interval=30

# Directory structure: preserve URL path under /aria2/data/downloads/
dir=/aria2/data/downloads

# Logging
log=/aria2/data/aria2.log
log-level=notice
console-log-level=notice

# Identify ourselves
user-agent=codex-publicus-mirror/1.0 (preservation project; contact: @lokkju)

# Retry on failure
max-tries=5
retry-wait=10
timeout=120
connect-timeout=30

# RPC for AriaNg web UI (entrypoint appends rpc-secret)
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=true
disable-ipv6=true

# Skip already-downloaded files
conditional-get=true
