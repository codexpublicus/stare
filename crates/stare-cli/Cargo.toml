[package]
name = "stare-cli"
version = "0.1.0"
edition = "2021"
description = "Citation resolution for U.S. case law"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[[bin]]
name = "stare"
path = "src/main.rs"

[features]
default = ["mcp"]
# `stare mcp`, the MCP server over stdio (#162). Default on; off, the binary is the
# CLI alone, which is how its size without the server is measured.
mcp = ["dep:rmcp", "dep:tokio", "dep:base64"]

[dependencies]
stare = { path = "../stare" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# The official Rust MCP SDK, pinned exactly (design decision 2): the server and the
# stdio transport only.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time"] }
# Checks the tools' schemas against the JSON Schema meta-schema, and their results
# against their output schemas.
jsonschema = { version = "0.59", default-features = false }
flate2 = "1"
mockito = "1.7.2"
tempfile = "3.27.0"
