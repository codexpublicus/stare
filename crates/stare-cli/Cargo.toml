[package]
name = "stare-cli"
version = "0.1.0"
edition = "2021"
description = "Citation resolution for U.S. case law"
license = "PolyForm-Shield-1.0.0"

[[bin]]
name = "stare"
path = "src/main.rs"

[dependencies]
stare = { path = "../stare" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
