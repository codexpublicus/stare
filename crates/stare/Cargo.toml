[package]
name = "stare"
version = "0.1.0"
edition = "2021"
description = "Citation resolution for U.S. case law"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[features]
default = ["embedded-data"]
# citare's reporter, edition and court tables compiled in. The CLI, stare-site,
# the tests and the index builder's stare-admin use them; stare-wasm
# builds without them and loads the bundle with `data::load`.
embedded-data = ["citare-core/embedded-data"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
toml = "0.8"
# Without default features: the `embedded-data` feature below compiles citare's
# data bundle in, and stare-wasm turns it off to load the bundle at runtime
# (#117, codexpublicus/citare docs/data-bundle.md).
citare-core = { git = "ssh://git@github.com/codexpublicus/citare.git", tag = "v0.7.5", default-features = false }
# Only the Unicode tables the patterns use (\d and \s, and (?i) in citare);
# the rest add about 230 KB to the WASM module once citare drops them too (#73).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
quick-xml = "0.37"
flate2 = "1"

# Native-only deps, not needed for WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
