[package]
name = "stare"
version = "0.1.0"
edition = "2021"
description = "Citation resolution for U.S. case law"
license = "PolyForm-Shield-1.0.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
citare-core = { git = "ssh://git@github.com/codexpublicus/citare.git", tag = "v0.4.1" }
# Only the Unicode tables the patterns use (\d and \s, and (?i) in citare);
# the rest add about 230 KB to the WASM module once citare drops them too (#73).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
quick-xml = "0.37"
flate2 = "1"

# Native-only deps, not needed for WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
