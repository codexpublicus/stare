[package]
name = "stare-admin"
version = "0.1.0"
edition = "2021"
description = "Build tools for stare.pub case law index"
license = "PolyForm-Shield-1.0.0"

[[bin]]
name = "stare-admin"
path = "src/main.rs"

[dependencies]
stare = { path = "../stare" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# reads CourtListener's gzipped export manifest for the unified index
flate2 = "1"
# gzips citare's data bundle for the site (#117); about 9% smaller than gzip -9
zopfli = { version = "0.8", default-features = false, features = ["std", "gzip"] }

[dev-dependencies]
regex = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
