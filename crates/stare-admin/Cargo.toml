[package]
name = "stare-admin"
version = "0.1.0"
edition = "2021"
description = "Build tools for stare.pub case law index"
license = "PolyForm-Shield-1.0.0"

[[bin]]
name = "stare-admin"
path = "src/main.rs"

[dependencies]
stare = { path = "../stare" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
