# git-cliff config for stare.pub site releases (vYYYY.MM.DD.N CalVer tags).
#
# Used by release-prepare.yml (the release PR's CHANGELOG.md), release.yml (the
# GitHub Release notes and the /about "What's new" build) and by hand:
#
#   git cliff --unreleased --tag "$(node scripts/calver.mjs)"
#
# Only Features, Fixes and Performance are shown; every other type is hidden, and
# commits that aren't Conventional Commits (merge commits among them) are dropped.
# web/src/lib/changelog.js parses the body format below, so change them together.

[changelog]
header = """
# Changelog

Site releases of stare.pub. Each release is tagged `vYYYY.MM.DD.N` and deployed to production when its release PR merges.
"""
body = """
{%- if version %}
## [{{ version }}](https://github.com/codexpublicus/stare/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/codexpublicus/stare/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
filter_commits = true
protect_breaking_commits = false
# The site is the web app and the Rust it compiles to WASM; the CLIs and the
# archival pipeline aren't part of its version.
include_paths = ["web/**", "crates/stare/**", "crates/stare-wasm/**", "wrangler.jsonc"]
tag_pattern = "^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$"
sort_commits = "oldest"
# Squash merges end the subject with "(#58)"; link it. Commits from merge-commit
# PRs carry no number and get only their commit link.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/codexpublicus/stare/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(docs|chore|ci|test|build|style|refactor)", skip = true },
  { message = ".*", skip = true },
]
